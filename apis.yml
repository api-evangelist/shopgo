aid: shopgo
name: ShopGo
description: >-
  ShopGo (now branded Makane) is a MENA-focused eCommerce SaaS platform based in
  Amman, Jordan and founded in 2012, backed by 500 Global. It lets merchants
  build and run online stores with integrated payment and shipment options
  across the Middle East and North Africa. For developers, ShopGo publishes a
  GitBook developer portal (docs.shopgo.me) documenting two REST APIs served
  from api.shopgo.me: a Management API for store, order, payment and shipment
  administration, and an internal Platform API for SaaS tenant control. Both use
  API-key authentication and a JSON result/payload envelope, and the platform
  supports configurable checkout webhooks (custom shipping rates, order
  confirmation).
